# Paste inside aaPanel: Website -> your site -> Config (replace/add these location blocks).
# Site root must be:  /www/wwwroot/shopsphere/frontend/dist
# aaPanel already manages server_name, SSL and listen 80/443 for you.

# 1) API -> Node (PM2) on localhost:5000
location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}

# 2) React SPA routing: unknown paths return index.html
location / {
    try_files $uri $uri/ /index.html;
}

# 3) Cache static build assets (hashed filenames), never cache index.html
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
location = /index.html {
    add_header Cache-Control "no-store";
}
